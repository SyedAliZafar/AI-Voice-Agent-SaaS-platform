[project]
name = "voiceagent"
version = "0.1.0"
description = "AI voice agent SaaS platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12.0",
    # Used only for Retell webhook signature verification (Retell.verify) in
    # services/retell_adapter.py — the HMAC scheme is not worth reimplementing by hand.
    "retell-sdk>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these; reformatting them creates noise and diff churn against
# what alembic will produce next time.
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults, but that IS the FastAPI dependency
# idiom (`db: AsyncSession = Depends(get_db)`) — these are evaluated per-request by the
# framework, not once at import. Without this the whole API layer is permanently red.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
