services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceagent
      MINIO_ROOT_PASSWORD: voiceagent123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceagent:voiceagent@postgres:5432/voiceagent
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    # --proxy-headers/--forwarded-allow-ips matter once the tunnel below is running:
    # without them uvicorn sees the tunnel as the client and builds http:// URLs for
    # what is really an https:// request.
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*

  # Public ingress for local dev — Retell has to reach this backend from the internet
  # (webhooks today, the custom-LLM websocket next). Opt-in by design:
  #     docker compose --profile tunnel up
  # Starting it publishes your local API to a public URL, so only run it once auth is
  # working (backend/api/deps.py) and never leave it running unattended. Prints a
  # https://<random>.trycloudflare.com URL in its logs; the wss:// form of that same
  # host is what a Retell custom-LLM agent would be pointed at.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceagent:voiceagent@postgres:5432/voiceagent
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.workers.celery_app worker --loglevel=info

volumes:
  pgdata:
  miniodata:
