services:
  # Local Postgres is now OPT-IN (`--profile local-db`). The shared Neon instance in .env
  # is the default so both devs read and write the same calls/prospects/leads — a local
  # container DB would silently give each machine its own private, diverging copy.
  # Only start this if you deliberately want throwaway local data:
  #   docker compose --profile local-db up -d postgres
  # and point DATABASE_URL at localhost:5433 (see .env for that string).
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceagent
      MINIO_ROOT_PASSWORD: voiceagent123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # DATABASE_URL is deliberately NOT set here. A value in this block overrides
      # env_file, so hardcoding the local container DB (as this once did) silently
      # ignored the shared Neon URL in .env and gave each dev a private database.
      # Redis/MinIO stay per-machine, so those still get compose-network overrides.
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Only used when PUBLIC_BASE_URL=auto — the compose-network route to the quick
      # tunnel's metrics server. config.py's default targets localhost instead, for
      # host-run tooling.
      CLOUDFLARED_METRICS_URL: http://tunnel-quick:20241
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    # --proxy-headers/--forwarded-allow-ips matter once the tunnel below is running:
    # without them uvicorn sees the tunnel as the client and builds http:// URLs for
    # what is really an https:// request.
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*

  # Public ingress for local dev — Retell has to reach this backend from the internet
  # (webhooks, and the custom-LLM websocket). Opt-in by design: starting either service
  # below publishes your local API to a public URL, so only run one once auth is working
  # (backend/api/deps.py) and never leave it running unattended.
  #
  # Two options, pick one profile:
  #
  #   docker compose --profile tunnel up -d        # named tunnel, permanent hostname
  #   docker compose --profile tunnel-quick up -d  # quick tunnel, zero setup
  #
  # `tunnel` (recommended) needs a one-time Cloudflare setup that produces CF_TUNNEL_TOKEN
  # in .env — see RUN.md "Named tunnel setup". The payoff: PUBLIC_BASE_URL never changes,
  # so it's set once and never has to be updated again.
  #
  # `tunnel-quick` needs no account, but its https://<random>.trycloudflare.com hostname
  # changes on every restart, AND the tunnel can silently die mid-session while
  # `docker compose ps` still reports it as Up (see RUN.md) — that exact failure mode is
  # what caused custom-LLM calls to go to dead air on 2026-08-04. Fine for a quick check,
  # not for anything you want to leave running.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # CF_TUNNEL_TOKEN comes from the project's .env, substituted here by `docker compose`
    # itself (not passed into the container as an env var) — see RUN.md for how to mint
    # one. --metrics exposes the /ready endpoint the healthcheck below calls.
    # --protocol http2: see the tunnel-quick service below for why QUIC is not the default
    # here. Same network, same failure mode.
    command: >
      tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:20241
      run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      # `cloudflared tunnel ready` hits its own /ready endpoint and only exits 0 once a
      # connection is actually registered — unlike `docker compose ps`, this catches the
      # "stuck in a silent reconnect loop while still reporting Up" failure documented in
      # RUN.md and CONTEXT.md ADR-007. cloudflared's image has no shell, so this has to be
      # its own subcommand rather than a curl/wget one-liner.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-quick"]
    # --protocol http2 forces the tunnel onto TCP instead of cloudflared's default QUIC,
    # which runs over UDP. On 2026-08-05 the quick tunnel here reconnect-looped roughly
    # every 60-90s ("failed to accept QUIC stream: timeout: no recent network activity",
    # "Failed to dial a quic connection"), taking PUBLIC_BASE_URL down with it mid-request
    # and making the custom-LLM websocket unusable. cloudflared also logged
    # "failed to sufficiently increase receive buffer size (was: 208 kiB, wanted: 7168 kiB,
    # got: 416 kiB)" — Docker Desktop on Windows can't give QUIC the UDP buffers it wants,
    # and restrictive networks frequently drop or throttle UDP outright. HTTP/2 is slightly
    # slower in theory but actually stays connected, which matters rather more.
    # --metrics exposes cloudflared's own HTTP server on :20241, which serves
    # /quicktunnel — the assigned https://<random>.trycloudflare.com hostname. That's
    # what lets PUBLIC_BASE_URL=auto discover the current URL instead of a human
    # copy-pasting it out of the logs after every restart (see backend/services/
    # public_url.py). The named `tunnel` service above already runs with --metrics for
    # its healthcheck; this mirrors it.
    command: >
      tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:20241
      --url http://api:8000
    # A quick tunnel that dies stays dead otherwise — that's how PUBLIC_BASE_URL went
    # stale on 2026-08-08 (container Exited 255, nothing restarted it) and cost a test
    # call on 2026-08-10. Restarting mints a NEW hostname, which is exactly why the
    # auto-discovery above is the other half of this fix.
    restart: unless-stopped
    # Published so host-run tooling (scripts/check_custom_llm.py, which executes via
    # `uv run` outside the compose network and therefore can't resolve the service
    # name) can read /quicktunnel too. Containers reach it as tunnel-quick:20241.
    ports:
      - "20241:20241"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # See the api service above for why DATABASE_URL must not be set here.
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Only used when PUBLIC_BASE_URL=auto — the compose-network route to the quick
      # tunnel's metrics server. config.py's default targets localhost instead, for
      # host-run tooling.
      CLOUDFLARED_METRICS_URL: http://tunnel-quick:20241
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.workers.celery_app worker --loglevel=info

  # Fires the lead retry scheduler (ADR-011: dispatch_due_leads/sweep_stale_leads) on
  # celery_app.py's beat_schedule. A worker alone never runs a beat_schedule — it only
  # executes tasks it's handed, so this is a separate process, not the worker's job.
  # No Bark leads means no cost to leaving this running; skip it if leads aren't in use yet.
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.workers.celery_app beat --loglevel=info

volumes:
  pgdata:
  miniodata:
